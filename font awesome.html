<!DOCTYPE html>
<html>
<head>
    <title>Font Awesome Icons</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body{
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        i{
            font-size: 60px;
            margin: 20px;
            color: blue;
        }

        h1{
            color: darkred;
        }
    </style>
</head>

<body>

    <h1>Font Awesome Icons Example</h1>

    <i class="fa-solid fa-house"></i>
    <p>Home Icon</p>

    <i class="fa-solid fa-user"></i>
    <p>User Icon</p>

    <i class="fa-solid fa-envelope"></i>
    <p>Message Icon</p>

    <i class="fa-solid fa-phone"></i>
    <p>Phone Icon</p>

    <i class="fa-solid fa-heart"></i>
    <p>Heart Icon</p>

</body>
</html>
